name: employee-onboarding-local

services:
  sqledge:
    container_name: sqledge
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqledge-data:/var/opt/mssql
    networks:
      - sb-emulator

  servicebus-emulator:
    container_name: servicebus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - sqledge
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
      SQL_SERVER: sqledge
      SQL_WAIT_INTERVAL: "30"
      EMULATOR_HTTP_PORT: "5300"
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - "C:/Users/YerraguntlaKoushik/source/repos/azure-service-bus-emulator-installer/ServiceBus-Emulator/Config/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    networks:
      - sb-emulator

volumes:
  sqledge-data:

networks:
  sb-emulator:
    driver: bridge
