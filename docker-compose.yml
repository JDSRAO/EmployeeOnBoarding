
services:
  # Application SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    ports:
      - "1433:1433"
    networks:
      - app-network

  # SQL Edge for Service Bus Emulator
  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sqledge
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    networks:
      - app-network

  # Azure Service Bus Emulator
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: servicebus-emulator
    depends_on:
      - sqledge
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA}"
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
      SQL_WAIT_INTERVAL: "${SQL_WAIT_INTERVAL}"
      EMULATOR_HTTP_PORT: "${EMULATOR_HTTP_PORT}"
    volumes:
      - ./backend/src/EmployeeOnBoarding.Api/ServiceBus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"
      - "5300:5300"
    networks:
      - app-network

  # EmployeeOnBoarding API
  backend:
    build:
      context: .
      dockerfile: backend/src/EmployeeOnBoarding.Api/Dockerfile
    container_name: employeeonboarding-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__SqlDatabase: "Server=sqlserver,1433;Database=${SQL_DATABASE};User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;"

      ConnectionStrings__BlobStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://host.docker.internal:10000/devstoreaccount1;"

      ServiceBus__ConnectionString: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"

      ServiceBus__QueueName: "${ServiceBus__QueueName}"
      Storage__ContainerName: "${Storage__ContainerName}"
      Cors__AllowedOrigins__0: "${Cors__AllowedOrigins__0}"

    depends_on:
      - sqlserver
      - servicebus-emulator
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

